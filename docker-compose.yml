version: '3.8'

services:
  das-sentinel-agent:
    build: .
    container_name: das-sentinel-agent
    restart: unless-stopped
    ports:
      - "8000:8000"   # 主控制台与 API 服务
      - "8088:8088"   # 内置示范靶场
    volumes:
      - ./data:/app/data
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - LAB_PORT=8088
      - HENGNAO_PLATFORM_URL=https://gc.das-ai.com
